const matCache = new Map();
function M(c, o){
  const key = c + '|' + (o ? JSON.stringify(o) : '');
  if(!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({color:c, roughness:.7, metalness:.1, ...(o||{})}));
  return matCache.get(key);
}
function add(g, geo, mat, x=0, y=0, z=0, cast=true){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = cast; m.receiveShadow = true; g.add(m); return m;
}
const box = (g,w,h,d,c,x,y,z,o) => add(g, new THREE.BoxGeometry(w,h,d), M(c,o), x, y+h/2, z);
const cyl = (g,rt,rb,h,c,x,y,z,seg=14,o) => add(g, new THREE.CylinderGeometry(rt,rb,h,seg), M(c,o), x, y+h/2, z);
const cone = (g,r,h,c,x,y,z,seg=8,o) => add(g, new THREE.ConeGeometry(r,h,seg), M(c,o), x, y+h/2, z);
const sph = (g,r,c,x,y,z,o) => add(g, new THREE.SphereGeometry(r,14,12), M(c,o), x, y, z);
const glow = c => ({emissive:c, emissiveIntensity:1.4});
const rnd = (a,b) => a + Math.random()*(b-a);

function pine(g,x,z,s=1,c=0x166534){ cyl(g,.12*s,.18*s,.8*s,0x5b3a1a,x,0,z,6); for(let i=0;i<3;i++) cone(g,(1-i*.25)*s,1.1*s,c,x,(.6+i*.6)*s,z,8); }
function roundTree(g,x,z,s=1,c=0x22c55e){ cyl(g,.15*s,.22*s,1.3*s,0x6b4423,x,0,z,6); sph(g,.9*s,c,x,1.9*s,z); sph(g,.6*s,c,x+.4*s,2.3*s,z+.2*s); }
function lamp(g,x,z,c=0xfef08a){ cyl(g,.05,.07,1.5,0x374151,x,0,z,6); sph(g,.14,c,x,1.65,z,glow(c)); }
function rock(g,x,z,s=1,c=0x6b7280){ const m = add(g,new THREE.DodecahedronGeometry(.5*s,0),M(c),x,.3*s,z); m.rotation.set(rnd(0,3),rnd(0,3),0); return m; }
function flowers(g,x,z,cols,n=8,r=.8){ cyl(g,r+.1,r+.1,.06,0x16a34a,x,0,z,14,{roughness:1}); for(let i=0;i<n;i++){ const a=rnd(0,6.28), d=rnd(0,r); sph(g,.1,cols[i%cols.length],x+Math.cos(a)*d,.2,z+Math.sin(a)*d); } }
function fenceLine(g,x1,z1,x2,z2,c=0xe7e5e4){
  const L = Math.hypot(x2-x1,z2-z1), n = Math.max(2,Math.round(L/.6));
  for(let i=0;i<=n;i++){ const t=i/n; box(g,.1,.6,.1,c,x1+(x2-x1)*t,0,z1+(z2-z1)*t); }
  const r = box(g,L,.08,.06,c,(x1+x2)/2,.35,(z1+z2)/2); r.rotation.y = -Math.atan2(z2-z1,x2-x1);
}
function flag(g,x,y,z,c=0xdc2626,w=1,h=.6){
  cyl(g,.04,.04,h*2.4,0xd4af37,x,y,z,6);
  const pv = new THREE.Group(); pv.position.set(x,y+h*2.0,z); g.add(pv);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), M(c,{side:THREE.DoubleSide})); p.position.x = w/2; pv.add(p);
  const sd = rnd(0,6); anim(t => { pv.rotation.y = Math.sin(t*2+sd)*.35; });
}
function npc(g,x,z,body=0x3b82f6,hair=0x92400e,ry=0,s=1){
  const n = new THREE.Group(); n.position.set(x,0,z); n.rotation.y = ry; n.scale.setScalar(s);
  cyl(n,.07,.07,.5,0x1f2937,-.1,0,0,6); cyl(n,.07,.07,.5,0x1f2937,.1,0,0,6);
  cyl(n,.17,.26,.75,body,0,.5,0,10);
  sph(n,.2,0xffe4d6,0,1.45,0); add(n,new THREE.SphereGeometry(.22,10,8,0,6.3,0,1.6),M(hair),0,1.5,0);
  g.add(n); const sd = rnd(0,6); anim(t => { n.position.y = Math.abs(Math.sin(t*1.6+sd))*.04; });
  return n;
}
function particles(g,n,o={}){
  const {rx=5,ry=4,rz=rx,y0=0,cx=0,cz=0,color=0xffffff,size=.22,mode='float',speed=1,opacity=.8} = o;
  const geo = new THREE.BufferGeometry(), pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=cx+rnd(-rx,rx); pos[i*3+1]=y0+rnd(0,ry); pos[i*3+2]=cz+rnd(-rz,rz); }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({color,size,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending}));
  pts.raycast = () => {}; g.add(pts);
  anim((t,dt) => {
    for(let i=0;i<n;i++){
      const ix=i*3;
      if(mode==='fall'){ pos[ix+1]-=dt*speed*1.1; pos[ix]+=Math.sin(t+i)*dt*.25; if(pos[ix+1]<y0) pos[ix+1]=y0+ry; }
      else if(mode==='rise'){ pos[ix+1]+=dt*speed; pos[ix]+=Math.sin(t*.8+i)*dt*.15; if(pos[ix+1]>y0+ry){ pos[ix+1]=y0; pos[ix]=cx+rnd(-rx,rx); } }
      else { pos[ix]+=Math.sin(t*.7+i)*dt*.4; pos[ix+1]+=Math.cos(t*.9+i*1.7)*dt*.3; pos[ix+2]+=Math.cos(t*.6+i*.5)*dt*.4; }
    }
    geo.attributes.position.needsUpdate = true;
  });
  return pts;
}
function bob(m,amp=.15,sp=1.5){ const b=m.position.y, sd=rnd(0,6); anim(t => { m.position.y = b+Math.sin(t*sp+sd)*amp; }); }
function cornerLamps(g,c=0xfef08a){ for(let i=0;i<6;i++){ const a=i*Math.PI/3; lamp(g,Math.sin(a)*6.1,Math.cos(a)*6.1,c); } }
function stall(g,x,z,c,ry=0){
  const s = new THREE.Group(); s.position.set(x,0,z); s.rotation.y = ry; g.add(s);
  box(s,1.6,.9,1.0,0x78350f,0,0,0);
  for(const px of [-.75,.75]) cyl(s,.04,.04,1.8,0x57534e,px,0,.45,6);
  const canopy = add(s,new THREE.CylinderGeometry(.95,.95,1.7,3),M(c),0,1.95,.1); canopy.rotation.z = Math.PI/2;
  for(let i=0;i<3;i++) sph(s,.14,[0xef4444,0xfacc15,0x22c55e][i],-.4+i*.4,1.0,0);
}

function rebuildDaughter(over){

  pawn = buildCharacter(o); pawn.traverse(m => { if(m.isMesh) m.castShadow = true; });

function placePawn(id,instant){

function pawnH(){ return pawn.userData.height || 3.4; }

// ---- 走動動畫 ----
let walking = false;
function moveDaughterTo(tx, tz, done){
  if(!pawn) return;
  const sx = pawn.position.x, sz = pawn.position.z, dist = Math.hypot(tx-sx,tz-sz);
  if(dist < .1){ done&&done(); return; }
  walking = true; let t0 = null; const dur = Math.max(1200,Math.min(2600,dist*70)), cycles = Math.max(3,dist/2);
  pawn.rotation.y = Math.atan2(tx-sx,tz-sz);
  function step(ts){
    if(!t0) t0 = ts; const p = Math.min((ts-t0)/dur,1), e = p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    pawn.position.x = sx+(tx-sx)*e; pawn.position.z = sz+(tz-sz)*e;
    const ph = p*cycles*Math.PI*2;
    pawnParts.leftLeg.rotation.x = Math.sin(ph)*.65; pawnParts.rightLeg.rotation.x = -Math.sin(ph)*.65;
    pawnParts.leftArm.rotation.x = -Math.sin(ph)*.5; pawnParts.rightArm.rotation.x = Math.sin(ph)*.5;
    pawnParts.body.position.y = Math.abs(Math.sin(ph))*.08;
    if(p < 1) requestAnimationFrame(step);
    else { ['leftLeg','rightLeg','leftArm','rightArm'].forEach(k => pawnParts[k].rotation.x = 0); pawnParts.body.position.y = 0; pawn.rotation.y = 0; walking = false; done&&done(); }
  }
  requestAnimationFrame(step);
}

function tween(fromV, toV, dur, apply){
  const a = fromV.clone(); let t0 = null;
  function f(ts){ if(!t0) t0 = ts; const p = Math.min((ts-t0)/dur,1), e = p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; apply(a.clone().lerp(toV,e)); if(p<1) requestAnimationFrame(f); }
  requestAnimationFrame(f);
}

function pickIsland(e){

  mouse.x = ((e.clientX-r.left)/r.width)*2-1; mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(tilesGroup.children,true);
  if(!hits.length) return null;
  let o = hits[0].object; while(o.parent && !(o.userData && o.userData.id)) o = o.parent;
  return o.userData && o.userData.id ? o.userData : null;
}

function addSlot(id){
  if(S.over) return;
  const i = S.slots.indexOf(null);
  if(i < 0){ toast('⚠️ 行程已滿','本季三個旬位都排滿了，點選旬位可取消。'); return; }
  S.slots[i] = id; renderSchedule();
}
function clearSlot(i){ S.slots[i] = null; renderSchedule(); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function applyAct(id,log){
  const a = A[id]; S.gold += a.g; S.stress = clamp(S.stress+(a.s||0),0,999);
  for(const k in a.fx) S.st[k] = clamp(S.st[k]+a.fx[k],0,999);
  if(a.tr) S.trust = clamp(S.trust+a.tr,0,100);
  if(a.sh) S.shadow = Math.max(0,S.shadow+a.sh);
  S.cnt[id]++;
  const e = eff();
  if(id==='palace' && e.cha>=300 && !S.flag.prince){ S.flag.prince = true; log.push('👑 在王宮與年輕的人類王儲不期而遇！（王儲邂逅旗標）'); }
  if(id==='mine' && S.cnt.mine>=2 && !S.flag.crystal){ S.flag.crystal = true; log.push('💎 礦坑深處有位神祕的晶脈王子向她點頭致意。'); }
  if(id==='spring' && (S.outfit==='forest' || e.kin>=400) && !S.flag.rabbit){ S.flag.rabbit = true; log.push('🐰 森林裡的白兔王子與星絨貓國王子前來報恩！'); }
  if(id==='summer' && (S.outfit==='south' || e.cha>=450) && !S.flag.south){ S.flag.south = true; log.push('🌊 南洋的汐音王子在海邊與她相遇。'); }
  if(id==='stars' && S.outfit==='gothic'){ S.shadow += 35; log.push('🌑 暗夜使魔在星空下與她共鳴（星蝕+35）。'); }
}
function runSeason(){
  if(S.over) return;
  if(!S.slots.some(Boolean)){ toast('⚠️ 尚無行程','請先到島嶼上挑選活動排進本季。'); return; }
  const log = [];
  S.slots.forEach(id => {
    if(!id) return; const a = A[id];
    if(a.g < 0 && S.gold + a.g < 0){ log.push(`💸 資金不足，跳過「${a.n}」`); return; }
    applyAct(id,log); log.push(`✅ ${a.n} 完成`);
  });
  S.slots = [null,null,null]; S.season++; S.contested = false;
  const prevStage = stageOfAge(ageOf(S.season-1)), nowStage = stageOfAge(ageOf(S.season));
  if(S.season < 32 && S.season % 4 === 0){ const sal = FATHER[S.father].sal; S.gold += sal; log.push(`🪙 新的一年，領取年度王國俸祿 +${sal} G`); }
  if(eff().sta <= S.stress) log.push('🤒 壓力超過體力負荷，蕾娜病倒了，建議安排休養或旅遊。');
  S.log = log;
  if(S.season >= 32){ updateAll(); toast('🎂 成年禮之日','蕾娜滿 18 歲了！正在判定她的星軌……',2500); setTimeout(() => judgeNow(true), 1500); return; }
  if(prevStage !== nowStage){
    rebuildDaughter(); log.push(`🌟 蕾娜長大了！進入${STAGE_N[nowStage]}（${ageOf(S.season)} 歲）`);
    toast('🌟 蕾娜長大了',`${STAGE_N[nowStage]} ｜ ${ageOf(S.season)} 歲`,4200);
  } else toast(`📅 ${ageOf(S.season)} 歲 ${SEASONS[S.season%4]}`, log.slice(0,3).join('\n'),3800);
  updateAll();
}
function hug(){ if(S.over) return; S.trust = clamp(S.trust+4,0,100); S.stress = clamp(S.stress-12,0,999); S.st.kin = clamp(S.st.kin+8,0,999); toast('🤗 摸頭關懷','信賴 +4｜壓力 -12｜體貼 +8'); updateAll(); }
function scold(){ if(S.over) return; S.st.mor = clamp(S.st.mor+15,0,999); S.shadow = Math.max(0,S.shadow-15); S.stress = clamp(S.stress+10,0,999); toast('📿 嚴厲訓誡','道德 +15｜星蝕 -15｜壓力 +10'); updateAll(); }

function doContest(id){
  if(S.over) return; if(S.contested){ toast('⚠️ 本季已參賽','每季只能報名一場大祭競賽。'); return; }

  toast(win ? `🏆 ${c.n} 奪冠！` : `🎖️ ${c.n} 佳作入圍`, `綜合評分 ${score}｜獎金 +${win?1500:400} G｜${Object.entries(c.g).map(([k,v]) => AL[k]+'+'+v).join(' ')}`,4200);
  updateAll();
}

function buyOutfit(k){ const o = OUTFITS[k]; if(S.gold < o.price){ toast('⚠️ 金幣不足','養育金不夠購買這套禮服。'); return; } S.gold -= o.price; S.owned[k] = true; wear(k); }
function buyItem(id){
  const s = SHOP.find(x => x.id === id); if(S.gold < s.price){ toast('⚠️ 金幣不足','養育金不夠。'); return; }
  S.gold -= s.price; for(const k in s.fx) S.st[k] = clamp(S.st[k]+s.fx[k],0,999);
  S.trust = clamp(S.trust+(s.tr||0),0,100); S.stress = clamp(S.stress+(s.stress||0),0,999); S.shadow += s.sh||0;
  if(s.flag){ S.flag[s.flag] = true; S.items[s.id] = true; }
  updateAll(); showWardrobe('shop'); toast('🎁 購買成功',s.n);
}

function showGallery(){
  const have = new Set(gallery);
  showModal(`<div class="flex justify-between items-center mb-3"><h2 class="serif text-lg font-bold text-amber-300">📖 60 結局圖鑑　<span class="text-xs text-amber-400">已收錄 ${have.size} / 60</span></h2>${mclose}</div>
   <div class="grid grid-cols-2 md:grid-cols-3 gap-1.5">${ENDINGS.map(e => `<button class="text-left p-2 rounded-lg border ${have.has(e.id)?'border-amber-300 bg-amber-500/15':'border-amber-500/20 bg-black/30'}" onclick="closeModal();previewEnding(${e.id})"><div class="text-[10px] text-amber-400">#${String(e.id).padStart(2,'0')}　評級 ${e.rank}</div><div class="text-xs font-bold ${have.has(e.id)?'text-amber-200':'text-amber-100/50'}">${have.has(e.id)?e.name:'？？？（點擊預覽）'}</div></button>`).join('')}</div>`);
}
function showSandbox(){
  showModal(`<div class="flex justify-between items-center mb-3"><h2 class="serif text-lg font-bold text-amber-300">🧪 沙盒測試工具</h2>${mclose}</div>
   <div class="grid md:grid-cols-2 gap-2 text-sm">
    <button class="btn-gold rounded-xl py-2" onclick="sb('unlock')">🎁 解鎖全套華服 ＋3000 G</button>
    <button class="btn-gold rounded-xl py-2" onclick="sb('flags')">✨ 點亮全部王子與羅盤旗標</button>
    <button class="btn-gold rounded-xl py-2" onclick="sb('queen')">👑 女皇滿屬預設</button>
    <button class="btn-gold rounded-xl py-2" onclick="sb('hero')">⚔️ 破界勇者預設</button>
    <button class="btn-gold rounded-xl py-2" onclick="sb('dark')">🌙 魔界女王預設</button>
    <button class="btn-gold rounded-xl py-2" onclick="sb('plus')">＋100 全屬性</button>
    <button class="btn-gold rounded-xl py-2" onclick="sb('age')">⏩ 快轉 4 季（成長一歲）</button>
   </div>`);
}
function sb(k){
  if(k==='unlock'){ Object.keys(OUTFITS).forEach(o => S.owned[o] = true); S.gold += 3000; }
  if(k==='flags') Object.assign(S.flag,{prince:true,south:true,rabbit:true,crystal:true,compass:true});
  if(k==='queen'){ ATTR.forEach(([a]) => S.st[a] = 880); S.st.ref = 960; S.st.cha = 960; S.trust = 100; S.shadow = 0; S.owned.queen = true; S.outfit = 'queen'; }
  if(k==='hero'){ ATTR.forEach(([a]) => S.st[a] = 300); Object.assign(S.st,{mar:960,sta:850,spi:850,mor:750}); S.owned.knight = true; S.outfit = 'knight'; }
  if(k==='dark'){ ATTR.forEach(([a]) => S.st[a] = 300); Object.assign(S.st,{cha:950,mar:720,sen:700,mor:40}); S.shadow = 350; S.owned.gothic = true; S.outfit = 'gothic'; }
  if(k==='plus') ATTR.forEach(([a]) => S.st[a] = clamp(S.st[a]+100,0,999));
  if(k==='age'){ const prev = stageOfAge(ageOf(S.season)); S.season = Math.min(31,S.season+4); if(stageOfAge(ageOf(S.season))!==prev) rebuildDaughter(); }
  rebuildDaughter(); updateAll(); toast('🧪 沙盒','已套用'); 
}

// ============================================================================
// 10. 結局判定與演出
// ============================================================================
let endingFx = null;
function judgeEnding(){
  const e = eff(), c = {gold:S.gold,trust:S.trust,shadow:S.shadow,cnt:S.cnt,flag:S.flag,owned:S.owned};
  return ENDINGS.find(x => x.cond(e,c));
}
function judgeNow(real){ if(S.over && !real) return; const en = judgeEnding(); showEnding(en, !real); }
function previewEnding(id){ showEnding(ENDINGS.find(x => x.id === id), true); }
function showEnding(en, preview){
  closePanel(); closeEnding(); toggleTour(false);
  if(!gallery.includes(en.id)){ gallery.push(en.id); saveGallery(gallery); }
  const gang = GANG_IDS.includes(en.id);
  rebuildDaughter({stage:'adult', outfit:en.outfit, gang});
  pawn.position.set(0, 0.3 + 0, isl('castle').z + 40);
  pawn.position.set(isl('home').x, .3, isl('home').z+4.9); pawn.rotation.y = 0;
  S.at = 'home';
  // 結局特效
  endingFx = new THREE.Group(); endingFx.position.copy(pawn.position); scene.add(endingFx);
  particles(endingFx,70,{rx:3.5,ry:6,y0:0,color:gang?0x38bdf8:0xfef08a,mode:gang?'float':'rise',size:.24,speed:.8});
  if(gang){
    for(let i=0;i<6;i++){ const a = Math.PI+(i-2.5)*.42, n = npc(endingFx,Math.sin(a)*3.4,Math.cos(a)*3.4-1.6,0x111827,0x0f172a,a+Math.PI,1.1); }
    const gl = new THREE.PointLight(0x38bdf8,3,14); gl.position.set(0,3,1); endingFx.add(gl);
  } else { const gl = new THREE.PointLight(0xfde68a,2.5,14); gl.position.set(0,4,2); endingFx.add(gl); }
  const h = pawnH(), p = pawn.position;
  flyTo({pos:new THREE.Vector3(p.x,p.y+h*.62,p.z+h*1.9), target:new THREE.Vector3(p.x,p.y+h*.5,p.z)},1100);
  const lines = gang ? ['夜幕低垂，蕾娜身後的黑衣人們整齊鞠躬。\n「老大，今晚怎麼安排？」她只是微微一笑。','玫瑰藤蔓在她的肩頭綻放，這是屬於暗街的成年禮。'] : [EPI[endingCat(en.id)]];
  const col = {S:'text-amber-300',A:'text-pink-300',B:'text-sky-300',C:'text-slate-300'}[en.rank];
  const card = document.getElementById('ending-card');
  card.innerHTML = `<div class="text-[10px] tracking-widest text-amber-400/80">${preview?'結局預覽':'18 歲成年禮'}　#${String(en.id).padStart(2,'0')}${gang?'　🌙 幫派結局造型':''}</div>
    <h3 class="serif text-lg font-bold ${col} mt-1">${en.name}</h3><div class="text-xs ${col} mb-2">評級 ${en.rank}　｜　${S.name} ${preview?'':'· '+ZOD[S.zod][0]+'・'+BLOOD[S.blood].n}</div>
    <p class="text-xs text-amber-100/85 leading-relaxed whitespace-pre-line mb-3">${lines.join('\n')}</p>
    <div class="flex flex-wrap gap-1.5"><button class="btn-cam" onclick="camView('daughter')">👧 全身</button><button class="btn-cam" onclick="camView('face')">🙂 臉部</button><button class="btn-cam" onclick="showGallery()">📖 圖鑑</button></div>
    <button class="btn-gold w-full py-2 rounded-xl mt-2 text-sm" onclick="${preview?'closeEnding(true)':'S.over=true;showSetup()'}">${preview?'結束演出，回到養成':'🔁 再玩一輪'}</button>`;
  card.classList.remove('hidden');
  if(!preview) S.over = true;
}
function closeEnding(restore){
  document.getElementById('ending-card').classList.add('hidden');
  if(endingFx){ scene.remove(endingFx); endingFx = null; }
  if(restore && S && !S.over){ rebuildDaughter(); flyTo(viewFor('home')); }
}

// ============================================================================
// 11. 渲染循環
// ============================================================================
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  controls.update();
  animated.forEach(f => f(t,dt));
  if(pawn && !walking && pawnParts.body) pawnParts.body.position.y = Math.sin(t*2.2)*.012;
  updatePlates();
  renderer.render(scene,camera);
}

init();
newGame(setupCfg);
rebuildDaughter();
updateAll();
animate();
showSetup();
</script>
</body>
</html>
